name: Smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  smoke:
    name: Protocol tests and listen port
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run the add-on smoke script
        run: ha-meshcore-tcproxy/smoke/smoke.sh
